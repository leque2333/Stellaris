name: anan-agent-core

services:
  agent-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anan-agent-core
    restart: unless-stopped
    ports:
      - "18895:18890" # 极简控制台网页端口（宿主 18895 → 容器 18890，与 README 一致）
    environment:
      - CONSOLE_PORT=18890
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化挂载记忆库与人设文件，不粘合任何 QQ / B站 等具体下游业务
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - anan-net

networks:
  anan-net:
    driver: bridge
    name: anan-agent-net
