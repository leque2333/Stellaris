name: anan-agent-core

services:
  agent-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anan-agent-core
    restart: unless-stopped
    ports:
      - "18890:18890" # 极简控制台网页端口
      - "18888:18888" # 智能体内核对外统一 API / 调控端口 (备用)
    environment:
      - CONSOLE_PORT=18890
      - ROBOT_BASE_DIR=/app
      - MEMORY_DB_PATH=/app/data/memory.db
      - PERSONA_FILE_PATH=/app/data/anan_persona.md
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化挂载记忆库与人设文件，不粘合任何 QQ / B站 等具体下游业务
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      - anan-net

networks:
  anan-net:
    driver: bridge
    name: anan-agent-net
