name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        run: python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # 只查"一定会炸"的语法级问题（未定义名、语法错误），
      # 风格类（unused import 等，很多是注册用的副作用导入）不阻塞 CI
      - name: ruff check（语法级）
        run: ruff check agent_core console tests --select E9,F63,F7,F82 --output-format=github
