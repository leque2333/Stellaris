<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellaris · 修改安全密码</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #1f2430;
            --text-light: #6b7280;
            --border-color-subtle: rgba(0, 0, 0, 0.06);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", sans-serif;
        }

        .card {
            width: 100%;
            max-width: 420px;
            margin: 24px;
            padding: 34px 34px 26px;
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--border-color-subtle);
            box-shadow: 0 18px 48px rgba(31, 36, 48, 0.08);
        }

        h1 { margin: 0 0 6px; font-size: 20px; }
        .hint { margin: 0 0 22px; font-size: 12.5px; line-height: 1.6; color: var(--text-light); }

        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            margin-bottom: 7px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-light);
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 0 13px;
            font-size: 14px;
            color: var(--text);
            background: #fbfbfd;
            border: 1px solid var(--border-color-subtle);
            border-radius: 10px;
            outline: none;
        }

        .form-input:focus { border-color: var(--primary); background: #ffffff; }

        .btn {
            width: 100%;
            height: 42px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.22);
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.7; cursor: wait; }

        .error-box {
            display: none;
            margin-bottom: 14px;
            padding: 9px 12px;
            font-size: 12.5px;
            color: #b91c1c;
            background: #fef2f2;
            border-radius: 9px;
        }

        .foot {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color-subtle);
            font-size: 11.5px;
            color: var(--text-light);
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>修改安全密码</h1>
        <p class="hint">
            首次启动使用随机口令时会强制改密；新密码至少 12 位。<br>
            改密成功后所有旧会话立即失效，需要用新密码重新登录。
        </p>

        <div class="error-box" id="error-box"><span id="error-text"></span></div>

        <form id="change-form" onsubmit="submitChange(event)">
            <div class="form-group">
                <label class="form-label" for="old-password">原密码</label>
                <input class="form-input" id="old-password" type="password"
                       autocomplete="current-password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="new-password">新密码（至少 12 位）</label>
                <input class="form-input" id="new-password" type="password"
                       autocomplete="new-password" minlength="12" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm-password">再输一次新密码</label>
                <input class="form-input" id="confirm-password" type="password"
                       autocomplete="new-password" minlength="12" required>
            </div>

            <button class="btn" id="btn-submit" type="submit">保存并重新登录</button>
        </form>

        <div class="foot">Stellaris · 私人中枢</div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            var first = document.getElementById('old-password');
            if (first) first.focus();
        });

        function showError(text) {
            document.getElementById('error-text').innerText = text;
            document.getElementById('error-box').style.display = 'block';
        }

        async function submitChange(event) {
            event.preventDefault();
            var btn = document.getElementById('btn-submit');
            var oldP = document.getElementById('old-password').value;
            var newP = document.getElementById('new-password').value;
            var confirmP = document.getElementById('confirm-password').value;
            document.getElementById('error-box').style.display = 'none';

            if (newP !== confirmP) {
                showError('两次输入的新密码不一致');
                return;
            }
            if (newP.length < 12) {
                showError('新密码长度至少需要 12 位');
                return;
            }

            var original = btn.innerText;
            btn.disabled = true;
            btn.innerText = '正在保存...';
            try {
                var res = await fetch('/api/auth/change_password', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_password: oldP, new_password: newP })
                });
                var data = await res.json();
                if (res.ok && data.success) {
                    btn.innerText = '已保存，正在返回登录页...';
                    window.location.href = '/login';
                    return;
                }
                showError(data.message || data.error || '密码修改失败');
            } catch (err) {
                showError('无法连接到中枢服务，请确认服务已启动');
            } finally {
                btn.disabled = false;
                if (btn.innerText === '正在保存...') btn.innerText = original;
            }
        }
    </script>
</body>
</html>
