<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellaris - 安全接入</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236366f1%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%2211%22 width=%2218%22 height=%2211%22 rx=%222%22 ry=%222%22/><path d=%22M7 11V7a5 5 0 0 1 10 0v4%22/></svg>">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--bg-body);
            background-image:
                radial-gradient(ellipse at 18% 12%, rgba(99, 102, 241, 0.08), transparent 55%),
                radial-gradient(ellipse at 82% 88%, rgba(2, 132, 199, 0.06), transparent 50%);
            color: var(--text-primary);
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 34px 30px 26px;
            border-radius: 18px;
            background: var(--bg-surface-elevated, #ffffff);
            border: 1px solid var(--border-color, rgba(0, 0, 0, 0.07));
            box-shadow: 0 24px 64px rgba(15, 23, 42, 0.10);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 24px rgba(99, 102, 241, 0.28);
        }

        .brand h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand h1 span {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
            margin-left: 6px;
        }

        .brand p {
            margin: 7px 0 0;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px !important;
            background: rgba(15, 23, 42, 0.04) !important;
            border: 1px solid transparent !important;
            border-radius: 9px !important;
            color: var(--text-primary) !important;
            font-size: 13.5px !important;
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .form-input:focus {
            background: #ffffff !important;
            border-color: rgba(99, 102, 241, 0.45) !important;
            outline: none !important;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap .form-input {
            padding-right: 58px !important;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .password-toggle:hover {
            background: rgba(15, 23, 42, 0.06);
            color: var(--text-primary);
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0 18px;
            font-size: 12.5px;
            color: var(--text-muted);
            user-select: none;
        }

        .remember-row input {
            accent-color: var(--primary, #6366f1);
        }

        .error-box {
            display: none;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 9px;
            background: rgba(220, 38, 38, 0.06);
            border: 1px solid rgba(220, 38, 38, 0.16);
            color: #b91c1c;
            font-size: 12.5px;
            line-height: 1.5;
        }

        .btn-login {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 10px;
            background: var(--primary, #6366f1);
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.22);
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .btn-login:hover {
            background: var(--primary-hover, #4f46e5);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-foot {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color-subtle, rgba(0, 0, 0, 0.05));
            text-align: center;
            font-size: 11.5px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand">
            <div class="brand-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Stellaris</h1>
            <p>私人中枢 · 安全接入</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">账号</label>
                <input class="form-input" id="username" name="username" value="admin" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <div class="password-wrap">
                    <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="password-toggle" type="button" onclick="togglePasswordVisibility()">显示</button>
                </div>
            </div>

            <label class="remember-row">
                <input type="checkbox" id="remember-me" checked>
                <span>记住登录状态（7 天）</span>
            </label>

            <div class="error-box" id="error-box">
                <span id="error-text"></span>
            </div>

            <button class="btn-login" id="btn-submit" type="submit">
                <span class="spinner" id="btn-spinner"></span>
                <span id="btn-text">安全验证并登入中枢</span>
            </button>
        </form>

        <div class="login-foot">
            <span id="mapping-host-text">安全通信节点</span>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const host = window.location.host;
            const tag = document.getElementById('mapping-host-text');
            if (host.includes('18891')) {
                tag.innerText = `本地运行端: ${host}`;
            } else {
                tag.innerText = `安全通信节点: ${host}`;
            }
            const pwd = document.getElementById('password');
            if (pwd) pwd.focus();
        });

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const btn = document.querySelector('.password-toggle');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.innerText = '隐藏';
            } else {
                pwd.type = 'password';
                btn.innerText = '显示';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const errBox = document.getElementById('error-box');
            const errText = document.getElementById('error-text');
            const btnSubmit = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            errBox.style.display = 'none';
            btnSubmit.disabled = true;
            btnText.innerText = '正在验证...';
            btnSpinner.style.display = 'inline-block';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember-me').checked;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    btnText.innerText = '验证通过，正在进入中枢...';
                    if (data.token) localStorage.setItem('anan_auth_token', data.token);
                    setTimeout(() => { window.location.href = '/'; }, 300);
                } else {
                    errText.innerText = data.error || '用户名或密码不正确';
                    errBox.style.display = 'flex';
                    btnSubmit.disabled = false;
                    btnText.innerText = '安全验证并登入中枢';
                    btnSpinner.style.display = 'none';
                    document.getElementById('password').select();
                }
            } catch (err) {
                errText.innerText = '无法连接到中枢服务，请确认服务已启动。';
                errBox.style.display = 'flex';
                btnSubmit.disabled = false;
                btnText.innerText = '安全验证并登入中枢';
                btnSpinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
